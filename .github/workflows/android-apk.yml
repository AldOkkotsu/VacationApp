name: Build Android APK

on:
  push:
    branches:
      - codex/android-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and package Android demo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VACATIONAPP_TOOLS_DIR: ${{ runner.temp }}/vacation-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned .NET, MAUI and Android tools
        run: bash scripts/setup-cloud.sh

      - name: Run core tests and build installable APK
        run: bash scripts/check.sh

      - name: Save APK for download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VacationApp-Android-APK
          path: src/VacationApp/bin/Debug/net10.0-android/com.aldokkotsu.vacationapp-Signed.apk
          if-no-files-found: error
          retention-days: 14
